[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jagadish-confidence-calibrated-autonomy"
version = "0.1.0"
description = "Accuracy-tiered decision autonomy with appeal paths (synthetic demo)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["calib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
